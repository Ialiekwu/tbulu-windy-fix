name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify pinned dependencies
        run: python3 scripts/bootstrap.py
      - name: Test request scope and signing safeguards
        run: bash scripts/test.sh
      - name: Build unsigned developer APK
        run: bash scripts/build.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: developer-apk-unsigned-not-installable
          path: dist/unsigned/*.apk
          if-no-files-found: error
          retention-days: 7
